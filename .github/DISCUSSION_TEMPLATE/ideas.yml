title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape **Time Flies: Living Clock™**! 💡
        Please search existing ideas first. If yours is already there, upvote it and add your thoughts.
        By posting, you agree we may use your idea as described in LICENSE.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clock and customization
        - Scenery and landscapes
        - Weather and effects
        - Nightstand Mode
        - Holiday themes
        - Ambient sounds
        - Accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Time Flies to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: Tell us where your clock lives and how this would make it better.
  - type: markdown
    attributes:
      value: "⚠️ Please don't include personal information such as your address or phone number."
